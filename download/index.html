<h1>Get Dandrey</h1>
<p class="muted" id="msg">Taking you to the App Store…</p>
<a class="btn" id="go" href="#">Open the App Store</a>
<script>
// Set this to the app's Apple ID (the number in App Store Connect → App Information)
// once the app is live. The in-app share button links here, so this is the only
// place that needs to change.
const APP_STORE_ID = "";
const go = document.getElementById("go");
if (APP_STORE_ID) {
  const url = "https://apps.apple.com/app/id" + APP_STORE_ID;
  go.href = url;
  location.replace(url);
} else {
  document.getElementById("msg").textContent = "Dandrey is coming to the App Store soon.";
  go.href = "../";
  go.textContent = "Learn more";
}
</script>
